name: Go GUI CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Smoke build
        run: go build -o hello-gui .

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: hello-gui-linux-x64
            extra_ldflags: ""

          - os: macos-14
            artifact: hello-gui-macos-arm64
            extra_ldflags: ""

          - os: windows-latest
            artifact: hello-gui-windows-x64.exe
            extra_ldflags: "-H windowsgui"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config

      - name: Setup Windows GCC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = Join-Path $env:RUNNER_TEMP "msys64\mingw64\bin\gcc.exe"

          if (-not (Test-Path $gcc)) {
            $gcc = "C:\msys64\mingw64\bin\gcc.exe"
          }

          if (-not (Test-Path $gcc)) {
            $gcc = Get-ChildItem -Path $env:RUNNER_TEMP -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'mingw64\\bin\\gcc\.exe$' } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $gcc) {
            Write-Error "gcc.exe not found"
            exit 1
          }

          $gccDir = Split-Path $gcc -Parent

          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        env:
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-s -w ${{ matrix.extra_ldflags }} -X main.version=${{ github.ref_name }}" -o ${{ matrix.artifact }} .

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}